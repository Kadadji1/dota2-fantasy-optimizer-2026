name: Fix complete player-team mapping

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-player-team-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete player-team map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/Optimizer.tsx')
          source = path.read_text()
          mapping = '''const teamByPlayerId: Record<string,string> = {
  "ysr-niu":"Team Resilience","satanic-noticed":"Team Vision","yuma-wisper":"LGD Gaming","watson-dm":"Team Yandex",
  "kiritych-miero":"BoomBoys","skiter-atf":"Team Falcons","ame-xxs":"Xtreme Gaming","nightfall-ws":"Aurora Gaming",
  "pure-33":"Iron Wing","yatoro-collapse":"Team Spirit","shiro-bach":"Vici Gaming","ghost-fayde":"GamerLegion",
  "micke-ace":"Team Liquid","ssnovv-corrupted":"HULIGANI","natsumi-raven":"OG","sumail-davai":"Nigma Galaxy",
  "nisha":"Team Liquid","marl1ne":"Team Falcons","gpk":"BoomBoys","lorenof":"Nigma Galaxy",
  "echozz":"Team Resilience","mikoto":"Aurora Gaming","bzm":"Iron Wing","noone":"Team Vision",
  "xm":"Vici Gaming","tailung":"LGD Gaming","larl":"Team Spirit","chira":"Team Yandex",
  "rcy":"GamerLegion","nts":"Xtreme Gaming","mirage":"HULIGANI","yopaj":"OG",
  "thiolicor-kj":"LGD Gaming","saksa-malady":"Team Yandex","tims-skem":"OG","cr1t-sneyking":"Team Falcons",
  "fy-xnova":"Xtreme Gaming","ari-whitemon":"Iron Wing","mira-kaori":"Aurora Gaming","omar-gh":"Nigma Galaxy",
  "boxi-tofu":"Team Liquid","rue-notme":"Team Spirit","xinq-y":"Vici Gaming","9class-dukalis":"Team Vision",
  "planet-zzq":"Team Resilience","save-kataomi":"BoomBoys","bignum-speeed":"GamerLegion","sayuw-respect":"HULIGANI"
};'''
          source, count = re.subn(
              r'const teamByPlayerId: Record<string,string> = \{.*?\n\};',
              mapping,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one mapping block, replaced {count}')
          path.write_text(source)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Optimizer.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: map every fantasy entry to its TI 2026 team"
            git push
          fi
