name: Fix title bonus calculation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-title-bonus.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch title calculation and copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/Optimizer.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'titleIntro: "Choose one Prefix + Suffix for the entire Fantasy roster. Changing the title does not use roll tokens.",': 'titleIntro: "Choose one Prefix + Suffix for the entire Fantasy roster. Both bonuses apply independently to each player’s game score when their conditions are met. Changing the title does not use roll tokens.",',
              'suffixNote: "Suffix events cannot be projected reliably before the games. The value below is a conditional scenario, not guaranteed points.",': 'suffixNote: "Suffix events cannot be projected reliably before the games. The value below adds the Suffix bonus to the base roster score independently from the expected Prefix bonus.",',
              'titleIntro: "Выберите один общий Prefix + Suffix для всего Fantasy-состава. Смена титула не расходует жетоны.",': 'titleIntro: "Выберите один общий Prefix + Suffix для всего Fantasy-состава. Оба бонуса независимо применяются к счёту каждого игрока за игру, если выполнены их условия. Смена титула не расходует жетоны.",',
              'suffixNote: "События суффиксов нельзя надёжно предсказать до игр. Значение ниже — условный сценарий, а не гарантированные очки.",': 'suffixNote: "События суффиксов нельзя надёжно предсказать до игр. Значение ниже независимо добавляет бонус суффикса к базовому счёту состава, не усиливая ожидаемый бонус префикса.",',
              'const suffixTriggeredScore=totalScore*(1+suffixes[suffix].bonus/100);': 'const suffixTriggeredScore=totalScore+baseTotalScore*(suffixes[suffix].bonus/100);'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old}")
              text = text.replace(old, new, 1)

          old_en = '"Suffixes are displayed as conditional scenarios because their future trigger cannot be projected reliably."'
          new_en = '"Suffixes are displayed as conditional scenarios. Their bonus is calculated independently from the base score and does not multiply the expected Prefix bonus."'
          old_ru = '"Суффиксы показаны как условные сценарии, потому что их срабатывание нельзя надёжно предсказать заранее."'
          new_ru = '"Суффиксы показаны как условные сценарии. Их бонус независимо рассчитывается от базового счёта и не умножает ожидаемый бонус префикса."'
          if old_en not in text or old_ru not in text:
              raise SystemExit("Methodology text not found")
          text = text.replace(old_en, new_en, 1).replace(old_ru, new_ru, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-title-bonus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Optimizer.tsx .github/workflows/fix-title-bonus.yml
          git commit -m "Fix independent Prefix and Suffix bonus calculation"
          git push
