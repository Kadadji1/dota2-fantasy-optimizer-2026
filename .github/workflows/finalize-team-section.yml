name: Repair alternative ranking layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-team-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix alternative row grid
        run: |
          cat >> app/globals.css <<'CSS'

/* Keep ranking rows aligned with and without a mapped team logo. */
.alternative-row{
  grid-template-columns:32px minmax(0,1fr) auto;
  min-width:0;
}
.alternative-row:has(.team-logo){
  grid-template-columns:32px 38px minmax(0,1fr) auto;
}
.alternative-row>div{
  min-width:0;
}
.alternative-row>div>strong,
.alternative-row>div>small{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.alternative-row>b{
  white-space:nowrap;
  justify-self:end;
  padding-left:8px;
}
@media(max-width:700px){
  .alternative-row{grid-template-columns:30px minmax(0,1fr) auto}
  .alternative-row:has(.team-logo){grid-template-columns:30px 34px minmax(0,1fr) auto}
}
CSS
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: align alternative ranking rows"
            git push
          fi
