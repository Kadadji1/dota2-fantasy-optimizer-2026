name: Apply Reddit dataset teams

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-team-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update optimizer dataset presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/Optimizer.tsx')
          s = path.read_text()

          # Remove the fixed 16-team tournament list.
          s = re.sub(r'\nconst tournamentTeams = \[.*?\] as const;\n', '\n', s, count=1, flags=re.S)

          # Build the Teams section only from players actually present in rankings.
          pattern = r'  const teamOverview=useMemo<TeamEntry\[\]>\(\(\)=>\{.*?\n\},\[rankings\]\);'
          replacement = '''  const teamOverview=useMemo<TeamEntry[]>(()=>{
    const teams=new Map<string,TeamEntry>();
    roles.forEach(role=>rankings[role].forEach(entry=>{
      const team=playerTeam(entry.player.id,entry.player.team); if(!team)return;
      const current=teams.get(team)??{team,roles:{},total:0};
      if(!current.roles[role]||entry.score>current.roles[role]!.score){
        current.roles[role]={name:entry.player.name,score:entry.score};
      }
      teams.set(team,current);
    }));
    return Array.from(teams.values())
      .map(entry=>({...entry,total:roles.reduce((sum,role)=>sum+(entry.roles[role]?.score??0),0)}))
      .sort((a,b)=>b.total-a.total);
  },[rankings]);'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit(f'teamOverview replacements: {n}')

          # Remove empty-team rendering; all displayed teams now have data.
          old_cards = '<div className="team-grid">{teamOverview.map(entry=>{const represented=roles.filter(role=>entry.roles[role]).length;return <article className={`team-card ${represented===0?"team-card-empty":""}`} key={entry.team}><div className="team-card-header"><div className="team-card-title"><TeamLogo team={entry.team} size="lg"/><h3>{entry.team}</h3></div><strong>{represented?Math.round(entry.total).toLocaleString(locale):"—"}</strong></div><small>{t.availableTotal}</small>{represented?<div className="team-role-list">{roles.map(role=>entry.roles[role]?<div key={role}><span>{t[role]}</span><b>{entry.roles[role]!.name}</b><em>{Math.round(entry.roles[role]!.score).toLocaleString(locale)}</em></div>:null)}</div>:<div className="team-empty-state">{t.noData}</div>}<footer>{t.representedRoles}: {represented}/3</footer></article>})}</div>'
          new_cards = '<div className="team-grid">{teamOverview.map(entry=><article className="team-card" key={entry.team}><div className="team-card-header"><div className="team-card-title"><TeamLogo team={entry.team} size="lg"/><h3>{entry.team}</h3></div><strong>{Math.round(entry.total).toLocaleString(locale)}</strong></div><small>{t.availableTotal}</small><div className="team-role-list">{roles.map(role=>entry.roles[role]?<div key={role}><span>{t[role]}</span><b>{entry.roles[role]!.name}</b><em>{Math.round(entry.roles[role]!.score).toLocaleString(locale)}</em></div>:null)}</div><footer>{t.representedRoles}: {roles.filter(role=>entry.roles[role]).length}/3</footer></article>)}</div>'
          if old_cards not in s:
            raise SystemExit('team cards block not found')
          s = s.replace(old_cards, new_cards, 1)

          # Correct dataset attribution and match count.
          s = s.replace('source: "Community dataset · TI 2026 methodology"', 'source: "Reddit dataset · 13 Tier 1 tournaments"')
          s = s.replace('source: "Данные сообщества · методика TI 2026"', 'source: "Данные Reddit · 13 турниров Tier 1"')
          s = s.replace('<strong>1,408</strong>', '<strong>1,601</strong>')

          path.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Optimizer.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: use only teams represented in Reddit dataset"
            git push
          fi
